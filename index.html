    <style>

        function detectLanguage(){currentLang='ar';applyLanguage();}
        function applyLanguage(){const body=document.body;if(currentLang==='ar'){body.dir='rtl';body.lang='ar';body.classList.remove('ltr');document.getElementById('langToggle').textContent='English';}else{body.dir='ltr';body.lang='en';body.classList.add('ltr');document.getElementById('langToggle').textContent='العربية';}updateUserUI();renderCurrentPage();renderCart();}
        function toggleLanguage(){currentLang=currentLang==='ar'?'en':'ar';applyLanguage();}
        function getProductName(p){return p.nameAr;}
        function getProductDesc(p){return p.descAr;}
        function getReviewText(r){return r.textAr;}
        function getOriginalPrice(sp,discountPct){return Math.round(sp/(1-discountPct/100)/10)*10;}
        function getShippingCost(gov){return CAIRO_GIZA_GOVERNORATES.includes(gov)?SHIPPING_CAIRO_GIZA:SHIPPING_OTHER;}
        function updateUserUI(){const btn=document.getElementById('userBtn');const label=document.getElementById('userBtnLabel');if(currentUser){btn.classList.add('logged-in');label.textContent=currentUser.name?currentUser.name.split(' ')[0]:(currentLang==='ar'?'حسابي':'Account');}else{btn.classList.remove('logged-in');label.textContent=currentLang==='ar'?'حسابي':'Account';}}

        function navigateTo(page,productId=null){currentPage=page;selectedProductId=productId;selectedSize=null;selectedColor=null;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-links a[data-page]').forEach(a=>a.classList.remove('active'));const tp=document.getElementById('page-'+page);if(tp)tp.classList.add('active');const nl=document.querySelector(`.nav-links a[data-page="${page}"]`);if(nl)nl.classList.add('active');document.getElementById('navLinks').classList.remove('open');renderCurrentPage();window.scrollTo({top:0,behavior:'smooth'});}
        function renderCurrentPage(){switch(currentPage){case'home':renderHomePage();break;case'homewear':renderCategoryPage('homewear','homewear_title');break;case'lingerie':renderCategoryPage('lingerie','lingerie_title');break;case'sleepwear':renderCategoryPage('sleepwear','sleepwear_title');break;case'shapewear':renderCategoryPage('shapewear','shapewear_title');break;case'newarrivals':renderNewArrivalsPage();break;case'product-detail':renderProductDetailPage();break;default:renderHomePage();}}
        function getProductImgUrl(product,size){if(product.imgUrl&&product.imgUrl.includes('unsplash')){return product.imgUrl.replace('w=400&h=500',size||'w=400&h=500');}return product.imgUrl||`https://placehold.co/${size||'400x500'}/f4ede6/b8865c?text=${encodeURIComponent(getProductName(product).substring(0,12))}`;}

        function renderProductCard(product){
            const imgUrl=getProductImgUrl(product,'w=400&h=500');const isNew=product.isNew?'<span class="badge-new">NEW</span>':'';const op=getOriginalPrice(product.price,product.discountPct);
            return `<div class="product-card" onclick="navigateTo('product-detail',${product.id})"><div class="product-card-img">${isNew}<img src="${imgUrl}" alt="${getProductName(product)}" class="placeholder-img" loading="lazy" onerror="this.parentElement.style.background='linear-gradient(135deg, #f4ede6, #e8dcd5)';this.style.display='none';"><div class="img-overlay"></div></div><div class="product-card-body"><div class="product-name">${getProductName(product)}</div><div class="product-cat">${t('nav_'+product.category)}</div><div class="price-wrapper"><span class="original-price">${op} ${t('egp')}</span><span class="sale-price">${product.price} ${t('egp')}</span><span class="discount-badge">-${product.discountPct}%</span></div></div></div>`;
        }

            })
            .then(response => response.json())
            .then(data => console.log('Notification sent successfully:', data))
            .catch(error => console.error('Error sending notification:', error));
        }

        function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toast._timeout);toast._timeout=setTimeout(()=>toast.classList.remove('show'),3500);}
        function toggleMobileMenu(){document.getElementById('navLinks').classList.toggle('open');}
        function init(){detectLanguage();updateCartCount();updateUserUI();renderCart();renderHomePage();document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){if(document.getElementById('checkoutModal').classList.contains('open'))closeCheckout();else if(document.getElementById('accountModal').classList.contains('open'))closeAccountModal();else if(document.getElementById('cartDrawer').classList.contains('open'))toggleCart();}});}
        init();
    </script>
</body>
</html>
